class: GalaxyUserTool
id: gx_float_zero
version: "1.0.0"
name: gx_float_zero
container: busybox
# Regression fixture: a required float input whose default is 0.0 (see gx_int_zero).
shell_command: echo '$(inputs.parameter)' >> output.txt
inputs:
  - name: parameter
    type: float
    value: 0.0
outputs:
  - name: output
    type: data
    format: txt
    from_work_dir: output.txt
