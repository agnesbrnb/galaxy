class: GalaxyUserTool
id: gx_int_zero
version: "1.0.0"
name: gx_int_zero
container: busybox
# Regression fixture: a required integer input whose default is 0. The parameter
# factory used to test the default with ``if value:`` and raise ParameterDefinitionError
# on a (falsy) 0; building this tool's parameter bundle exercises that path.
shell_command: echo '$(inputs.parameter)' >> output.txt
inputs:
  - name: parameter
    type: integer
    value: 0
outputs:
  - name: output
    type: data
    format: txt
    from_work_dir: output.txt
